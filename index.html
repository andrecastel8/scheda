<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scheda">
<meta name="theme-color" content="#e9ecef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Scheda 8 settimane</title>
<style>
:root{
  color-scheme: light;
  --bg:#e9ecef; --surface:#ffffff; --surface-2:#f1f3f5; --surface-3:#dde1e6;
  --ink:#1a1e23; --ink-2:#4c5560; --ink-3:#7d8893; --line:#d5dae0;
  --ok:#177a45; --ok-soft:#dcefe3; --warn:#8a5a00; --warn-soft:#f6ecd2; --danger:#b4262f; --danger-soft:#f7dfe0;
  /* colori dei dischi olimpici: identificano la seduta */
  --p-legs:#d0303c; --p-legs-on:#ffffff;
  --p-pull:#2560c8; --p-pull-on:#ffffff;
  --p-push:#f0b90b; --p-push-on:#1a1e23;
  --p-upperv:#1d9354; --p-upperv-on:#ffffff;
  --p-sb:#1a1e23; --p-sb-on:#ffffff;
  --acc:var(--ink); --acc-on:var(--surface);
  --tab-h:60px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#14181d; --surface:#1c2128; --surface-2:#242a32; --surface-3:#2f363f;
    --ink:#eef1f4; --ink-2:#a9b2bc; --ink-3:#737e8a; --line:#2b323a;
    --ok:#45c983; --ok-soft:#163222; --warn:#f2b54a; --warn-soft:#33270f; --danger:#ff6b6f; --danger-soft:#3b1a1c;
    --p-legs:#f0525d; --p-legs-on:#14181d;
    --p-pull:#5b93f2; --p-pull-on:#0f1520;
    --p-push:#f5c638; --p-push-on:#14181d;
    --p-upperv:#3cc47a; --p-upperv-on:#0e1a13;
    --p-sb:#eef1f4; --p-sb-on:#14181d;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(var(--tab-h) + 28px + env(safe-area-inset-bottom))}
body.has-timer{padding-bottom:calc(var(--tab-h) + 120px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* intestazione */
.top{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .top{background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(1.3) blur(14px);-webkit-backdrop-filter:saturate(1.3) blur(14px)}
}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:12px;padding-bottom:8px}
.hmain{font-family:var(--num);font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05;white-space:nowrap}
.hmain small{font-size:17px;font-weight:600;color:var(--ink-3);letter-spacing:0;margin-left:2px}
.hsub{font-size:13px;color:var(--ink-2);margin-top:3px}
.save{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;margin-top:3px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.save[data-s="saved"] i{background:var(--ok)}
.save[data-s="saving"] i{background:var(--warn);animation:pulse 1s infinite}
.save[data-s="error"] i,.save[data-s="memory"] i,.save[data-s="readonly"] i{background:var(--danger)}
@keyframes pulse{50%{opacity:.25}}
.wkbar{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding-bottom:10px}
.wkbar i{height:4px;border-radius:2px;background:var(--surface-3)}
.wkbar i.past{background:var(--ink-3)}
.wkbar i.cur{background:var(--ink)}

/* data e sedute */
.daterow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 12px}
.dname{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.dsub{font-size:13px;color:var(--ink-2)}
.dctl{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.mini{font-size:13px;font-weight:600;padding:8px 11px;border-radius:9px;background:var(--surface);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.mini:active{background:var(--surface-3)}
.mini.danger{color:var(--danger)}
.mini.armed,.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.mini.icon{width:36px;padding:8px 0;text-align:center}
.datepick{position:relative;overflow:hidden}
.datepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;-webkit-appearance:none;appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 4px}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;padding:9px 13px 9px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.plate{width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:inset 0 0 0 4px var(--acc),inset 0 0 0 7px var(--surface)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-on)}
.chip.on .plate{background:var(--acc-on);box-shadow:inset 0 0 0 4px var(--acc-on),inset 0 0 0 7px var(--acc)}
.chip .tag{font-size:11px;font-weight:700;opacity:.7}
.banner{font-size:14px;line-height:1.4;padding:10px 12px;border-radius:12px;margin:10px 0;background:var(--surface-2);color:var(--ink-2)}
.banner.info{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.banner.err{background:var(--danger-soft);color:var(--ink)}
.prog{margin:14px 0 4px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.prog-top b{font-size:15px;color:var(--ink)}
.prog-bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.prog-f{height:100%;width:0;background:var(--acc);border-radius:3px;transition:width .3s ease}
.warm{font-size:13px;color:var(--ink-2);margin:12px 0 0}

/* esercizi */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin:12px 0}
.ex.complete{box-shadow:inset 4px 0 0 var(--acc)}
.ex-head{display:flex;gap:12px;align-items:flex-start}
.ex-num{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:15px;color:var(--ink)}
.ex.complete .ex-num{background:var(--acc);color:var(--acc-on)}
.ex-t{flex:1;min-width:0}
.ex-t h3{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;column-gap:14px;row-gap:2px;font-size:13px;color:var(--ink-2);margin-top:3px}
.meta b{color:var(--ink);font-weight:700}
.meta .ss{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);padding:0 7px;border-radius:6px;white-space:nowrap}
.vartog{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;margin-top:10px;gap:2px}
.vartog button{font-size:13px;font-weight:600;padding:6px 11px;border-radius:8px;color:var(--ink-2)}
.vartog button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.last{font-size:13px;color:var(--ink-2);margin-top:10px}
.last b{color:var(--ink);font-size:14px}
.hint{font-size:13px;font-weight:600;margin-top:8px;padding:7px 10px;border-radius:9px;background:var(--surface-2);color:var(--ink-2)}
.hint.up{background:var(--ok-soft);color:var(--ok)}
.hint.down{background:var(--warn-soft);color:var(--warn)}
.hint.cal{background:transparent;border:1px dashed var(--line);color:var(--ink-2)}
.exnote{font-size:13px;color:var(--ink-2);margin-top:8px}
.wknote{font-size:13px;font-weight:600;color:var(--warn);margin-top:6px}
.sets{margin-top:12px;display:grid;gap:8px}
.set{display:grid;grid-template-columns:20px 1fr 1fr 52px;gap:8px;align-items:center}
.set-n{font-family:var(--num);font-size:14px;font-weight:700;color:var(--ink-3);text-align:center}
.fld{position:relative}
.fld input{width:100%;height:50px;border:1.5px solid transparent;border-radius:11px;background:var(--surface-2);font-size:21px;font-weight:700;text-align:center;padding:0 30px 0 8px;-webkit-appearance:none;appearance:none;outline:none}
.fld input::placeholder{color:var(--ink-3);font-weight:500;opacity:.8}
.fld input:focus{border-color:var(--acc);background:var(--surface)}
.fld .u{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;color:var(--ink-3);pointer-events:none}
.tick{width:52px;height:50px;border-radius:11px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink-3);background:var(--surface)}
.tick svg{width:24px;height:24px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.set.done .tick{background:var(--acc);border-color:var(--acc);color:var(--acc-on)}
.set.done .fld input{background:var(--surface-3)}
.set.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ex-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.setbtns{display:flex;gap:6px}
.rirsel{display:flex;align-items:center;gap:4px}
.rirsel span{font-size:12px;font-weight:600;color:var(--ink-3);margin-right:4px}
.rc{min-width:34px;height:32px;border-radius:8px;background:var(--surface-2);font-family:var(--num);font-size:14px;font-weight:700;color:var(--ink-2)}
.rc.on{background:var(--ink);color:var(--surface)}
details.note{margin-top:10px}
details.note summary{font-size:13px;font-weight:600;color:var(--ink-3);list-style:none;cursor:pointer;display:inline-block;padding:2px 0}
details.note summary::-webkit-details-marker{display:none}
details.note summary::before{content:"+ "}
details.note[open] summary::before{content:"– "}
details.note textarea{display:block;width:100%;margin-top:6px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);padding:8px 10px;font-size:16px;line-height:1.35;resize:vertical;min-height:62px;outline:none}
details.note textarea:focus{border-color:var(--acc)}
.empty{text-align:center;color:var(--ink-3);padding:40px 16px;font-size:15px}

/* timer di recupero */
.timer{position:fixed;left:12px;right:12px;bottom:calc(var(--tab-h) + 10px + env(safe-area-inset-bottom));z-index:40;max-width:536px;margin:0 auto;background:var(--ink);color:var(--surface);border-radius:18px;overflow:hidden}
.timer[hidden]{display:none}
.t-fill{position:absolute;left:0;bottom:0;height:5px;width:100%;background:var(--acc);transform-origin:left center;transition:transform .25s linear}
.t-row{position:relative;display:flex;justify-content:space-between;align-items:center;padding:11px 12px 13px 16px;gap:10px}
.t-info{min-width:0}
.t-lbl{font-size:12px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-time{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.t-btns{display:flex;gap:6px;flex:0 0 auto}
.t-btns button{min-width:46px;height:42px;border-radius:11px;background:rgba(128,128,128,.28);color:inherit;font-family:var(--num);font-weight:700;font-size:15px}
.timer.fin{background:var(--acc);color:var(--acc-on)}
.timer.fin .t-fill{display:none}

/* barra schede */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3)}
.tabbar svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--ink)}
.tabbar button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}

/* viste secondarie */
.vt{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:18px 0 12px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;padding:9px 10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.hitem{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}
.hhead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;text-align:left;font-size:15px}
.hhead .l{display:flex;align-items:center;gap:9px;min-width:0}
.hhead .r{font-size:13px;color:var(--ink-3);white-space:nowrap}
.hbody{padding:0 14px 12px;border-top:1px solid var(--line)}
.hrow{padding:10px 0;border-bottom:1px solid var(--line)}
.hrow:last-of-type{border-bottom:0}
.hn{font-size:13px;color:var(--ink-2)}
.hv{font-size:15px;font-weight:700;margin-top:2px}
.hnote{font-size:13px;color:var(--ink-3);margin-top:4px}
.hact{display:flex;gap:8px;justify-content:flex-end;padding-top:10px}
.selwrap{position:relative;display:block;margin-bottom:12px}
.selwrap select{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 36px 0 12px;font-size:16px;font-weight:600;-webkit-appearance:none;appearance:none}
.selwrap::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.spark{width:100%;height:auto;display:block;margin:8px 0 4px}
.cap{font-size:13px;color:var(--ink-2)}
.hl{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hl:last-child{border-bottom:0}
.hl .d{color:var(--ink-2);white-space:nowrap}
.hl .v{font-weight:700;text-align:right}
.hl .v small{display:block;font-weight:500;color:var(--ink-3);font-size:12px}

/* misure */
.kpi{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.k-l{font-size:13px;font-weight:600;color:var(--ink-2)}
.k-v{font-family:var(--num);font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.k-d{font-family:var(--num);font-size:14px;font-weight:700;padding:5px 9px;border-radius:8px}
.k-d.pos{background:var(--ok-soft);color:var(--ok)}
.k-d.neg{background:var(--warn-soft);color:var(--warn)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kgrid div{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--ink-2)}
.kgrid b{display:block;font-family:var(--num);font-size:18px;color:var(--ink)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2)}
.form input{height:46px;border-radius:10px;border:1.5px solid transparent;background:var(--surface-2);padding:0 10px;font-size:18px;font-weight:700;outline:none;-webkit-appearance:none;appearance:none;width:100%;min-width:0}
.form input:focus{border-color:var(--ink)}
.form .full{grid-column:1/-1}
.btn{display:block;width:100%;height:48px;border-radius:12px;background:var(--ink);color:var(--surface);font-weight:700;font-size:16px;margin-top:12px}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .btn{margin-top:8px}

/* info */
.sh{font-size:17px;font-weight:700;margin:24px 0 6px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-3);padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.cur td{font-weight:700}
.tbl tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--ink);padding-left:8px}
.prose p{font-size:14px;color:var(--ink-2);margin:8px 0;line-height:1.45}
.prose p b{color:var(--ink)}
.io{display:block;width:100%;min-height:96px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);padding:8px 10px;font-size:13px;font-family:ui-monospace,Menlo,monospace;margin-top:10px;outline:none}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-16px);opacity:0;pointer-events:none;z-index:60;background:var(--ink);color:var(--surface);font-size:14px;font-weight:600;padding:10px 14px;border-radius:12px;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{padding:60px 0;text-align:center;color:var(--ink-3)}
.linkbtn{font:inherit;font-weight:700;color:inherit;text-decoration:underline;padding:0}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap hdr">
    <div>
      <div class="hmain" id="hdrMain">Scheda</div>
      <div class="hsub" id="hdrSub"></div>
    </div>
    <div class="save" id="save" data-s="idle"><i></i><span>Carico</span></div>
  </div>
  <div class="wrap"><div class="wkbar" id="wkbar" aria-hidden="true"></div></div>
</header>

<main id="view"><div class="wrap"><div class="loading">Carico i dati salvati…</div></div></main>

<div id="timer" class="timer" hidden role="timer" aria-live="off">
  <div class="t-row">
    <div class="t-info">
      <div class="t-lbl" id="tLbl">Recupero</div>
      <div class="t-time" id="tTime">0:00</div>
    </div>
    <div class="t-btns">
      <button data-t="-15" aria-label="Togli 15 secondi">−15</button>
      <button data-t="15" aria-label="Aggiungi 15 secondi">+15</button>
      <button data-t="x" aria-label="Chiudi timer">✕</button>
    </div>
  </div>
  <div class="t-fill" id="tFill"></div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<nav class="tabbar" aria-label="Sezioni">
  <div class="in">
    <button data-tab="train" class="on"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg><span>Allenamento</span></button>
    <button data-tab="hist"><svg viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg><span>Storico</span></button>
    <button data-tab="meas"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="2"/><path d="M7 8v3M11 8v4M15 8v3"/></svg><span>Misure</span></button>
    <button data-tab="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.1"/></svg><span>Regole</span></button>
  </div>

/* ================= Programma ================= */

const PHASES = [
  {w:[1], name:'Calibrazione', multi:'2–3', iso:'2', dates:'26 ott – 1 nov'},
  {w:[2,3,4], name:'Progressione', multi:'2', iso:'1–2', dates:'2 – 22 nov'},
  {w:[5,6,7], name:'Spinta', multi:'1–2', iso:'0–1', dates:'23 nov – 13 dic'},
  {w:[8], name:'Scarico e test', multi:'3', iso:'2–3', dates:'14 – 20 dic'}
];
const INC = {
  smith:'aumenta di 2,5 kg', barbell:'aumenta di 2,5 kg',

};
const W1 = {0:'rest',1:'push',2:'legs',3:'pull',4:'basket',5:'upperv',6:'sb'};
const WN = {0:'rest',1:'legs',2:'pull',3:'push',4:'basket',5:'upperv',6:'sb'};

const EX = {};
SESSIONS.forEach(s => s.ex.forEach(e => {
  if(!EX[e.id]) EX[e.id] = {def:e, s:s.id};
  if(e.alt && !EX[e.alt.id]) EX[e.alt.id] = {def:e.alt, s:s.id};
}));

const ICON = {
  tick:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

/* ================= Utilità ================= */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function str(v){ return v == null ? '' : String(v).trim(); }
function pad(n){ return String(n).padStart(2,'0'); }
function dstr(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function todayStr(){ return dstr(new Date()); }
function parseD(s){ const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(s, n){ const d = parseD(s); d.setDate(d.getDate()+n); return dstr(d); }
function diffDays(a, b){ return Math.round((parseD(a) - parseD(b)) / 86400000); }
function weekOf(s){ const d = diffDays(s, START); if(d < 0) return 0; const w = Math.floor(d/7) + 1; return w > 8 ? 9 : w; }
function clampW(w){ return Math.min(8, Math.max(1, w)); }
function fmtDate(s){ const d = parseD(s); return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function num(v){ if(v == null || v === '') return NaN; return parseFloat(String(v).replace(',', '.')); }
function fx(n, dec){ return Number(n).toFixed(dec).replace('.', ','); }
function signed(n, dec){ const a = fx(Math.abs(n), dec); return (n > 0 ? '+' : n < 0 ? '−' : '') + a; }
function phaseOf(w){ return PHASES.find(p => p.w.includes(w)) || PHASES[0]; }
function getSession(id){ return SESSIONS.find(s => s.id === id); }
function key(d, s){ return d + '|' + s; }
function banner(t, cls){ return `<div class="banner ${cls || ''}">${esc(t)}</div>`; }
function accStyle(sid){ return `--acc:var(--p-${sid});--acc-on:var(--p-${sid}-on)`; }

/* ================= Stato ================= */
let data = null;
let storeMode = 'cloud'; // cloud | memory | readonly
const state = { tab:'train', date:todayStr(), session:null, histMode:'sessions', histEx:'smithflat', hexp:null };

function seed(){
  const S = (kg, reps) => reps.map(r => ({kg:String(kg), reps:String(r), done:true}));
  return {
    v:1, created:Date.now(), measures:[],
    logs:{
      '2026-10-26|push': { date:'2026-10-26', session:'push', ex:{
        smithflat:{v:'smithflat', sets:S(70,[8,7,6]), rir:null, note:''},
        smithinc:{v:'smithinc', sets:S(50,[10,8,8]), rir:null, note:''},
        spress:{v:'spress', sets:S(40,[8,8,8]), rir:null, note:'Fatte 3 serie invece di 2.'},
        latraise:{v:'latraise', sets:S(10,[16,16,14]), rir:null, note:'Fatte 3 serie invece di 4.'},
        ohecable:{v:'ohecable', sets:[], rir:null, note:'Eseguito con manubrio: 22 kg × 15, 15, 15 (massimo disponibile). Da qui in poi al cavo.'},
        cablecrunch:{v:'cablecrunch', sets:[], rir:null, note:'Circuito addominali da 8 minuti, livello 2.'}
      }}
    }
  };
}

function normalize(){
  if(!data || typeof data !== 'object') data = {};
  if(!data.logs || typeof data.logs !== 'object') data.logs = {};
  if(!Array.isArray(data.measures)) data.measures = [];
  Object.keys(data.logs).forEach(k => {
    const l = data.logs[k];
    if(!l || typeof l !== 'object' || !l.date || !l.session){ delete data.logs[k]; return; }
    if(!l.ex || typeof l.ex !== 'object') l.ex = {};
    if(l.session === 'legs' && l.ex.nordic && !l.ex.legcurl){ l.ex.legcurl = l.ex.nordic; delete l.ex.nordic; }
    Object.keys(l.ex).forEach(id => {
      const e = l.ex[id];
      if(!e.v) e.v = id;
      if(!Array.isArray(e.sets)) e.sets = [];
      e.sets.forEach(s => { s.kg = str(s.kg); s.reps = str(s.reps); s.done = !!s.done; });
      if(e.rir === undefined) e.rir = null;
      if(typeof e.note !== 'string') e.note = '';
    });
  });
  data.v = 1;
}

function hasData(l){
  return Object.values(l.ex || {}).some(e => (e.sets || []).some(s => str(s.reps) || str(s.kg)) || str(e.note));
}
function doneSets(l){
  return Object.values(l.ex || {}).reduce((a, e) => a + (e.sets || []).filter(s => str(s.reps)).length, 0);
}

function scheduled(date){
  const w = weekOf(date);
  const m = w === 1 ? W1 : WN;
  return m[parseD(date).getDay()];
}
function pickSession(date){
  const logged = SESSIONS.map(s => s.id).find(id => { const l = data.logs[key(date, id)]; return l && hasData(l); });
  if(logged) return logged;
  const sc = scheduled(date);
  return getSession(sc) ? sc : null;
}

function defFor(slot, v){ return (slot.alt && v === slot.alt.id) ? slot.alt : slot; }
function blank(n){ return Array.from({length:n}, () => ({kg:'', reps:'', done:false})); }
function plannedSets(def){ return clampW(weekOf(state.date)) === 8 ? Math.max(1, def.sets - 1) : def.sets; }
function slotOf(id){ return getSession(state.session).ex.find(x => x.id === id); }

function getEx(slot, create){
  const k = key(state.date, state.session);
  let log = data.logs[k];
  if(!log){
    if(!create) return null;
    log = data.logs[k] = {date:state.date, session:state.session, ex:{}};
  }
  let e = log.ex[slot.id];
  if(!e){
    if(!create) return null;
    e = log.ex[slot.id] = {v:slot.id, sets:[], rir:null, note:''};
  }
  if(create && !e.sets.length) e.sets = blank(plannedSets(defFor(slot, e.v)));
  return e;
}

function lastPerf(id){
  const cur = key(state.date, state.session);
  const arr = Object.keys(data.logs)
    .filter(k => k !== cur && data.logs[k].date <= state.date)
    .map(k => data.logs[k])
    .sort((a, b) => b.date.localeCompare(a.date));
  for(const l of arr){
    for(const e of Object.values(l.ex || {})){
      if(e.v === id){
        const sets = (e.sets || []).filter(s => str(s.reps));
        if(sets.length) return {date:l.date, sets, rir:e.rir};
      }
    }
  }
  return null;
}

function setsStr(sets, def){
  const pre = def && def.type === 'pullup' ? '+' : '';
  const sec = def && def.unit === 'sec';
  const ks = sets.map(s => str(s.kg));
  const rs = sets.map(s => str(s.reps) + (sec ? '"' : ''));
  if(ks.every(x => !x)) return rs.join(', ') + (sec ? '' : ' rip');
  if(ks.every(x => x === ks[0])) return pre + ks[0] + ' kg × ' + rs.join(', ');
  return sets.map((s, i) => (ks[i] ? pre + ks[i] : '–') + '×' + rs[i]).join(', ');
}

function rirTarget(def){
  if(def.kind === 'core') return '';
  const w = weekOf(state.date);
  if(w === 1 && state.session === 'legs') return '3';
  const p = phaseOf(clampW(w));
  return def.kind === 'multi' ? p.multi : p.iso;
}

function restTxt(def){
  if(def.restTxt) return def.restTxt;
  const s = def.rest;
  if(s >= 120){ const m = Math.floor(s/60), r = s % 60; return r ? `${m}'${r}"` : `${m}'`; }
  return `${s}"`;
}

function hint(def, last){
  const w = weekOf(state.date);
  const pre = def.type === 'pullup' ? '+' : '';
  if(w === 8) return {cls:'hold', t: def.kind === 'core' ? 'Scarico: una serie in meno.' : 'Scarico: stessi carichi della settimana 7, RIR 3.'};
  if(!last) return {cls:'cal', t: def.startKg ? `Prima seduta: parti da ${pre}${def.startKg} kg e calibra sul range e sul RIR.` : 'Prima seduta: calibra il carico sul range e sul RIR.'};
  const mn = def.reps[0], mx = def.reps[1];
  const reps = last.sets.map(s => num(s.reps));
  const planned = plannedSets(def);
  const kg0 = str(last.sets[0].kg);
  if(reps[0] < mn) return {cls:'down', t:`L’ultima volta la prima serie è scesa sotto ${mn}: riduci del 5–10%.`};
  if(reps.length >= planned && reps.slice(0, planned).every(r => r >= mx)){
    if(def.id === 'bss' && num(kg0) >= 24) return {cls:'up', t:'Range chiuso con 24 kg: passa alla Smith.'};
    return {cls:'up', t:`Range chiuso: ${INC[def.type]}.`};
  }
  const target = `${planned}×${mx}${def.unit === 'sec' ? '"' : ''}`;
  if(kg0 && def.type !== 'bw') return {cls:'hold', t:`Tieni ${pre}${kg0} kg e aggiungi ripetizioni fino a ${target}.`};
  return {cls:'hold', t:`Aggiungi ripetizioni fino a ${target}.`};
}

function weekNote(def){
  const w = weekOf(state.date);
  if(w === 8 && (def.id === 'pullup' || def.id === 'smithflat')) return 'Test: prima serie a RIR 1 con il carico della settimana 1, poi scarico. Confronta le ripetizioni.';
  return '';
}

/* ================= Salvataggio sul dispositivo ================= */
let LS = null;
try{ const t = '__probe__'; window.localStorage.setItem(t, '1'); window.localStorage.removeItem(t); LS = window.localStorage; }catch(e){ LS = null; }
const hasStore = !!LS;
let saveT = null, saveState = 'saved';

async function load(){
  if(!LS){ storeMode = 'memory'; data = seed(); return; }
  let raw = null;
  try{ raw = LS.getItem(KEY); }catch(e){ storeMode = 'memory'; data = seed(); return; }
  storeMode = 'cloud';
  if(raw === null){ data = seed(); flush(); }
  else {
    try{ data = JSON.parse(raw); }
    catch(e){
      try{ LS.setItem(KEY + ':illeggibile:' + Date.now(), raw); }catch(_){}
      data = seed(); flush();
      setTimeout(() => toast('Dati salvati illeggibili: ne ho conservato una copia e riparto da zero'), 300);
    }
  }
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
}

function setStatus(s){
  if(s) saveState = s;
  const el = $('#save');
  let st = saveState, txt;
  if(storeMode === 'memory'){ st = 'memory'; txt = 'Non salvato'; }
  else txt = {saved:'Salvato', saving:'Salvo…', error:'Non salvato'}[st] || 'Salvato';
  el.dataset.s = st;
  el.querySelector('span').textContent = txt;
}
function scheduleSave(){
  if(storeMode !== 'cloud'){ setStatus(); return; }
  setStatus('saving');
  clearTimeout(saveT);
  saveT = setTimeout(flush, 300);
}
function flush(){
  clearTimeout(saveT); saveT = null;
  if(storeMode !== 'cloud') return;
  try{ LS.setItem(KEY, JSON.stringify(data)); setStatus('saved'); }
  catch(e){ setStatus('error'); toast('Il browser non riesce a salvare: copia il backup da Regole'); }
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden' && saveT) flush(); });
window.addEventListener('pagehide', () => { if(saveT) flush(); });

function storeBanner(){
  if(storeMode === 'memory') return banner('Il browser non permette di salvare (succede in navigazione privata). I dati restano finché la pagina è aperta: copia il backup da Regole prima di chiudere.', 'err');
  return '';
}
function backupBanner(){
  if(storeMode !== 'cloud' || !Object.values(data.logs).some(hasData)) return '';
  const ref = data.lastBackup || data.created || Date.now();
  const days = Math.floor((Date.now() - ref) / 86400000);
  if(days < 7) return '';
  const t = data.lastBackup ? `Ultimo backup ${days} giorni fa.` : 'Non hai ancora fatto un backup.';
  return `<div class="banner warn">${t} I dati sono solo su questo iPhone: <button class="linkbtn" data-act="gobackup">copia il backup</button>.</div>`;
}

/* ================= Timer ================= */
const T = {end:0, total:0, iv:null, fired:false};
let actx = null;
function ensureAudio(){
  try{
    if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); }
    if(actx && actx.state === 'suspended') actx.resume();
  }catch(e){}
}
function beep(){
  if(navigator.vibrate) try{ navigator.vibrate([180,90,180]); }catch(e){}
  if(!actx) return;
  try{
    const t = actx.currentTime;
    [0, .28, .56].forEach(o => {
      const osc = actx.createOscillator(), g = actx.createGain();
      osc.type = 'sine'; osc.frequency.value = 880;
      g.gain.setValueAtTime(.0001, t+o);
      g.gain.exponentialRampToValueAtTime(.35, t+o+.02);
      g.gain.exponentialRampToValueAtTime(.0001, t+o+.2);
      osc.connect(g); g.connect(actx.destination);
      osc.start(t+o); osc.stop(t+o+.22);
    });
  }catch(e){}
}
function startTimer(sec, label, sid){
  const el = $('#timer');
  T.end = Date.now() + sec*1000; T.total = sec; T.fired = false;
  el.setAttribute('style', accStyle(sid));
  $('#tLbl').textContent = 'Recupero, ' + label;
  el.hidden = false; el.classList.remove('fin');
  document.body.classList.add('has-timer');
  clearInterval(T.iv); T.iv = setInterval(tick, 250); tick();
}
function tick(){
  const ms = Math.max(0, T.end - Date.now());
  const s = Math.ceil(ms/1000);
  $('#tTime').textContent = Math.floor(s/60) + ':' + pad(s % 60);
  $('#tFill').style.transform = 'scaleX(' + (T.total ? Math.min(1, ms/(T.total*1000)) : 0) + ')';
  if(ms <= 0 && !T.fired){
    T.fired = true; clearInterval(T.iv);
    $('#timer').classList.add('fin');
    $('#tLbl').textContent = 'Recupero finito';
    beep();
  }
}
function stopTimer(){
  clearInterval(T.iv);
  $('#timer').hidden = true;
  document.body.classList.remove('has-timer');
}
function wireTimer(){
  $('#timer').addEventListener('click', ev => {
    const b = ev.target.closest('[data-t]'); if(!b) return;
    const v = b.dataset.t;
    if(v === 'x'){ stopTimer(); return; }
    const d = parseInt(v, 10) * 1000;
    if(T.fired){
      if(d > 0){ T.end = Date.now() + d; T.total = d/1000; T.fired = false; $('#timer').classList.remove('fin'); $('#tLbl').textContent = 'Recupero extra'; clearInterval(T.iv); T.iv = setInterval(tick, 250); }
    } else {
      T.end = Math.max(Date.now(), T.end + d);
      if(d > 0) T.total += d/1000;
    }
    tick();
  });
}

/* ================= Toast e conferme ================= */
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400);
}
function confirmTap(btn, label){
  if(btn.dataset.armed === '1'){ btn.dataset.armed = ''; btn.classList.remove('armed'); btn.textContent = btn.dataset.orig; return true; }
  btn.dataset.orig = btn.textContent; btn.dataset.armed = '1';
  btn.textContent = label || 'Tocca di nuovo per confermare';
  btn.classList.add('armed');
  setTimeout(() => {
    if(btn.isConnected && btn.dataset.armed === '1'){ btn.dataset.armed = ''; btn.classList.remove('armed'); btn.textContent = btn.dataset.orig; }
  }, 3500);
  return false;
}

  const w = weekOf(state.date);
  let main, sub;
  if(w === 0){ main = 'Prima del blocco'; sub = 'Il blocco inizia lunedì 26 ottobre'; }
  else if(w === 9){ main = 'Blocco concluso'; sub = '8 settimane completate il 20 dicembre'; }

/* ================= Render: allenamento ================= */
function cardHTML(slot, idx){
  const e = getEx(slot, false);
  const vid = e ? e.v : slot.id;
  const def = defFor(slot, vid);
  const planned = plannedSets(def);
  const sets = (e && e.sets.length) ? e.sets : blank(planned);
  const last = lastPerf(def.id);
  const h = hint(def, last);
  const rir = rirTarget(def);
  const complete = sets.length > 0 && sets.every(s => s.done);
  const sec = def.unit === 'sec';
  const kgU = def.type === 'pullup' ? '+kg' : 'kg';

  let carry = '';
  const rows = sets.map((s, i) => {
    const own = str(s.kg);
    let ph = carry;
    if(!ph){
      if(last){ const ls = last.sets[i] || last.sets[last.sets.length-1]; ph = str(ls.kg); }
      else if(def.startKg) ph = def.startKg;
    }
    if(own) carry = own;
    if(!ph && def.type === 'bw') ph = '–';
    const rph = last && last.sets[i] ? str(last.sets[i].reps) : '';
    return `<div class="set${s.done ? ' done' : ''}" data-i="${i}">
      <span class="set-n">${i+1}</span>
      <div class="fld"><input class="n" inputmode="decimal" autocomplete="off" data-f="kg" value="${esc(s.kg)}" placeholder="${esc(ph)}" aria-label="Carico serie ${i+1}"><span class="u">${kgU}</span></div>
      <div class="fld"><input class="n" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-f="reps" value="${esc(s.reps)}" placeholder="${esc(rph)}" aria-label="${sec ? 'Secondi' : 'Ripetizioni'} serie ${i+1}"><span class="u">${sec ? 'sec' : 'rip'}</span></div>
      <button class="tick" data-act="tick" aria-label="Serie ${i+1} completata" aria-pressed="${s.done ? 'true' : 'false'}">${ICON.tick}</button>
    </div>`;
  }).join('');

  const scheme = `${planned}×${def.reps[0]}–${def.reps[1]}${sec ? '"' : ''}`;
  const meta = `<div class="meta"><span><b class="n">${scheme}</b>${def.side ? ' ' + esc(def.side) : ''}</span><span>rec <b class="n">${esc(restTxt(def))}</b></span>${rir ? `<span>RIR <b class="n">${rir}</b></span>` : ''}${def.ss ? `<span class="ss">${esc(def.ss)}</span>` : ''}</div>`;
  const vt = slot.alt ? `<div class="vartog" role="group" aria-label="Variante">${[slot, slot.alt].map(d => `<button data-act="var" data-v="${d.id}" class="${vid === d.id ? 'on' : ''}" aria-pressed="${vid === d.id}">${esc(d.short || d.name)}</button>`).join('')}</div>` : '';
  const lastH = last ? `<p class="last">Ultima volta, ${fmtDate(last.date)}: <b class="n">${esc(setsStr(last.sets, def))}</b>${last.rir != null ? `, RIR ${last.rir === 4 ? '4+' : last.rir}` : ''}</p>` : '';
  const wn = weekNote(def);
  const rirSel = def.kind !== 'core' ? `<div class="rirsel" role="group" aria-label="RIR dell’ultima serie"><span>RIR finale</span>${[0,1,2,3,4].map(n => `<button class="rc${e && e.rir === n ? ' on' : ''}" data-act="rir" data-n="${n}">${n === 4 ? '4+' : n}</button>`).join('')}</div>` : '';

  return `<article class="ex${complete ? ' complete' : ''}" data-slot="${slot.id}">
    <div class="ex-head">
      <span class="ex-num">${idx+1}</span>
      <div class="ex-t"><h3>${esc(def.name)}</h3>${meta}</div>
    </div>
    ${vt}
    ${lastH}
    <p class="hint ${h.cls}">${esc(h.t)}</p>
    ${def.note ? `<p class="exnote">${esc(def.note)}</p>` : ''}
    ${wn ? `<p class="wknote">${esc(wn)}</p>` : ''}
    <div class="sets">${rows}</div>
    <div class="ex-foot">
      <div class="setbtns"><button class="mini" data-act="rmset">− serie</button><button class="mini" data-act="addset">+ serie</button></div>
      ${rirSel}
    </div>
    <details class="note"${e && str(e.note) ? ' open' : ''}><summary>Nota</summary><textarea data-note rows="2" placeholder="Sensazioni, tecnica, regolazioni della macchina">${esc(e ? e.note : '')}</textarea></details>
  </article>`;
}

function progressCounts(){
  const s = getSession(state.session); let done = 0, tot = 0;
  s.ex.forEach(slot => {
    const e = getEx(slot, false);
    const def = e ? defFor(slot, e.v) : slot;
    const n = e && e.sets.length ? e.sets.length : plannedSets(def);
    tot += n;
    if(e) done += e.sets.filter(x => x.done).length;
  });
  return {done, tot};
}
function updateProgress(){
  const el = $('#prog'); if(!el) return;
  const p = progressCounts();
  $('.prog-t', el).innerHTML = `<b class="n">${p.done}</b> di <span class="n">${p.tot}</span> serie`;
  $('.prog-f', el).style.width = (p.tot ? p.done/p.tot*100 : 0) + '%';
}

function rerenderCard(card){
  const slot = slotOf(card.dataset.slot);
  const idx = getSession(state.session).ex.indexOf(slot);
  const tmp = document.createElement('div');
  tmp.innerHTML = cardHTML(slot, idx);
  card.replaceWith(tmp.firstElementChild);
}

function onTick(card, row){
  ensureAudio();
  const slot = slotOf(card.dataset.slot);
  const e = getEx(slot, true);
  const def = defFor(slot, e.v);
  const i = +row.dataset.i;
  const s = e.sets[i];
  const repsIn = $('[data-f="reps"]', row), kgIn = $('[data-f="kg"]', row);
  if(s.done){
    s.done = false; row.classList.remove('done');
  } else {
    if(!str(s.reps)){
      repsIn.focus();
      row.classList.add('shake'); setTimeout(() => row.classList.remove('shake'), 400);
      toast(def.unit === 'sec' ? 'Inserisci i secondi' : 'Inserisci le ripetizioni');
      return;
    }
    if(!str(s.kg) && def.type !== 'bw' && kgIn.placeholder && kgIn.placeholder !== '–'){
      s.kg = kgIn.placeholder; kgIn.value = s.kg;
    }
    s.done = true; row.classList.add('done');
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    startTimer(def.rest, def.name, state.session);
  }
  $('.tick', row).setAttribute('aria-pressed', s.done ? 'true' : 'false');
  card.classList.toggle('complete', e.sets.length > 0 && e.sets.every(x => x.done));
  updateProgress();
  scheduleSave();
}

/* ================= Render: storico ================= */
function exHistory(id){
  const out = [];
  Object.values(data.logs).forEach(l => Object.values(l.ex || {}).forEach(e => {
    if(e.v === id){
      const sets = (e.sets || []).filter(s => str(s.reps));
      if(sets.length) out.push({date:l.date, sets, rir:e.rir, note:e.note});
    }
  }));
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function e1rm(sets){
  let best = 0;
  sets.forEach(s => { const kg = num(s.kg), r = num(s.reps); if(kg > 0 && r > 0 && r <= 15) best = Math.max(best, kg * (1 + r/30)); });
  return best || null;
}
function spark(points){
  const W = 320, H = 96, P = 12;
  const vs = points.map(p => p.v), mn = Math.min(...vs), mx = Math.max(...vs), rng = (mx - mn) || 1;
  const x = i => P + (points.length === 1 ? (W - 2*P)/2 : i * (W - 2*P) / (points.length - 1));
  const y = v => H - P - (v - mn) / rng * (H - 2*P);
  const pts = points.map((p, i) => x(i).toFixed(1) + ',' + y(p.v).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento del massimale stimato">
    <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4" fill="var(--surface)" stroke="var(--acc)" stroke-width="2.5"/>`).join('')}
  </svg>`;
}

function renderHistory(){
  let h = `<div class="wrap"><h2 class="vt">Storico</h2>`;
  h += storeBanner();
  h += `<div class="seg" role="group"><button data-act="hmode" data-m="sessions" class="${state.histMode === 'sessions' ? 'on' : ''}">Sedute</button><button data-act="hmode" data-m="ex" class="${state.histMode === 'ex' ? 'on' : ''}">Esercizi</button></div>`;

  if(state.histMode === 'sessions'){
    const logs = Object.keys(data.logs).filter(k => hasData(data.logs[k])).sort((a, b) => data.logs[b].date.localeCompare(data.logs[a].date) || a.localeCompare(b));
    if(!logs.length) h += `<div class="empty">Nessuna seduta registrata. Le sedute compaiono qui appena inserisci la prima serie.</div>`;
    logs.forEach(k => {
      const l = data.logs[k], s = getSession(l.session), open = state.hexp === k;
      h += `<div class="hitem" style="${accStyle(l.session)}"><button class="hhead" data-act="hexp" data-key="${esc(k)}" aria-expanded="${open}"><span class="l"><i class="plate" aria-hidden="true"></i><span><b>${fmtDate(l.date)}</b>, ${esc(s ? s.name : l.session)}</span></span><span class="r n">${doneSets(l)} serie</span></button>`;
      if(open){
        h += `<div class="hbody">`;
        (s ? s.ex : []).forEach(slot => {
          const e = l.ex[slot.id]; if(!e) return;
          const def = defFor(slot, e.v);
          const sets = (e.sets || []).filter(x => str(x.reps));
          if(!sets.length && !str(e.note)) return;
          h += `<div class="hrow"><div class="hn">${esc(def.name)}</div><div class="hv n">${sets.length ? esc(setsStr(sets, def)) : '–'}${e.rir != null ? `, RIR ${e.rir === 4 ? '4+' : e.rir}` : ''}</div>${str(e.note) ? `<div class="hnote">${esc(e.note)}</div>` : ''}</div>`;
        });
        h += `<div class="hact"><button class="mini danger" data-act="hdel" data-key="${esc(k)}">Elimina seduta</button><button class="mini" data-act="hopen" data-key="${esc(k)}">Apri</button></div></div>`;
      }
      h += `</div>`;
    });
  } else {
    const seen = new Set();
    const opts = SESSIONS.map(s => {
      const items = [];
      s.ex.forEach(e => { [e, e.alt].filter(Boolean).forEach(d => { if(!seen.has(d.id)){ seen.add(d.id); items.push(d); } }); });
      return `<optgroup label="${esc(s.name)}">${items.map(d => `<option value="${d.id}"${state.histEx === d.id ? ' selected' : ''}>${esc(d.name)}</option>`).join('')}</optgroup>`;
    }).join('');
    const info = EX[state.histEx] || EX.smithflat;
    const def = info.def;
    const hist = exHistory(def.id);
    h += `<label class="selwrap"><select id="histSel" aria-label="Esercizio">${opts}</select></label>`;
    if(!hist.length){
      h += `<div class="empty">Nessun dato per questo esercizio.</div>`;
    } else {
      h += `<div class="card" style="${accStyle(info.s)}">`;
      const showSpark = def.kind === 'multi' && def.type !== 'pullup' && def.type !== 'bw';
      if(showSpark){
        const pts = hist.map(x => ({date:x.date, v:e1rm(x.sets)})).filter(p => p.v);
        if(pts.length){
          const f = pts[0].v, l = pts[pts.length-1].v;
          h += `<div class="cap">Massimale stimato (Epley) sul carico registrato</div>`;
          h += pts.length > 1 ? spark(pts) : '';
          h += `<div class="kpi" style="margin-top:6px"><div class="k-v">${fx(l, 1)}<small style="font-size:16px;color:var(--ink-3);font-weight:600"> kg</small></div>${pts.length > 1 ? `<div class="k-d n ${l >= f ? 'pos' : 'neg'}">${signed(l - f, 1)} kg</div>` : ''}</div>`;
        }
      }
      h += `<div style="margin-top:${showSpark ? '10px' : '0'}">`;
      hist.slice().reverse().forEach(x => {
        h += `<div class="hl"><span class="d">${fmtDate(x.date)}</span><span class="v n">${esc(setsStr(x.sets, def))}${x.rir != null ? `<small>RIR ${x.rir === 4 ? '4+' : x.rir}</small>` : ''}</span></div>`;
      });
      h += `</div></div>`;
    }
  }
  h += `</div>`;
  $('#view').innerHTML = h;
}

  </div>`;

  h += `<h3 class="sh">Come si usa</h3><div class="card prose">
    <p>Inserisci carico e ripetizioni, poi tocca la spunta: parte il recupero. Il numero in grigio è il dato dell’ultima volta; se lasci vuoto il carico, viene usato quello.</p>
    <p>Il suggerimento sotto ogni esercizio applica la doppia progressione all’ultima seduta registrata.</p>
    <p>Il timer suona solo con iPhone non in modalità silenziosa. Se blocchi lo schermo, il conteggio resta corretto ma il suono non parte.</p>
    <p>I dati si salvano da soli su questo iPhone. Safari e l’icona sulla schermata Home hanno memorie separate: apri sempre dall’icona.</p>
    <p>Una volta a settimana copia il backup e incollalo in una nota o in una mail a te stesso. Ti serve se cambi telefono o se il browser cancella i dati.</p>
  </div>`;

  h += `<h3 class="sh" id="backup">Backup</h3><div class="card">
    <div class="row2"><button class="btn sec" data-act="exp-copy">Copia backup</button><button class="btn sec" data-act="exp-dl">Scarica file</button></div>
    <textarea class="io" id="ioText" placeholder="Per ripristinare, incolla qui il testo del backup e tocca Ripristina."></textarea>
    <div class="row2"><button class="btn sec" data-act="imp">Ripristina</button><button class="btn danger" data-act="reset">Cancella tutto</button></div>
  </div>`;
  h += `</div>`;
  $('#view').innerHTML = h;
}

/* ================= Navigazione ================= */
function render(){
  renderHeader();
  if(state.tab === 'train') renderTrain();
  else if(state.tab === 'hist') renderHistory();
  else if(state.tab === 'meas') renderMeasures();
  else renderInfo();
  $$('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
}
function goDate(d){ state.date = d; state.session = pickSession(d); renderHeader(); renderTrain(); }

function wire(){
  const view = $('#view');

  $('.tabbar').addEventListener('click', ev => {
    const b = ev.target.closest('[data-tab]'); if(!b) return;
    state.tab = b.dataset.tab; render(); window.scrollTo(0, 0);
  });

  view.addEventListener('input', ev => {
    const t = ev.target;
    if(t.matches('[data-f]')){
      const card = t.closest('.ex'), row = t.closest('.set');
      const slot = slotOf(card.dataset.slot), e = getEx(slot, true), i = +row.dataset.i;
      e.sets[i][t.dataset.f] = t.value.trim();
      if(t.dataset.f === 'kg' && t.value.trim()){
        const v = t.value.trim();
        $$('.set', card).forEach(r => { if(+r.dataset.i > i){ const ki = $('[data-f="kg"]', r); if(!ki.value) ki.placeholder = v; } });
      }
      scheduleSave();
    } else if(t.matches('[data-note]')){
      const card = t.closest('.ex');
      getEx(slotOf(card.dataset.slot), true).note = t.value;
      scheduleSave();
    }
  });

  view.addEventListener('change', ev => {
    const t = ev.target;
    if(t.id === 'dateIn'){ if(t.value) goDate(t.value); }
    else if(t.id === 'histSel'){ state.histEx = t.value; renderHistory(); }
    else if(t.matches('[data-f="reps"]')){
      const card = t.closest('.ex'), row = t.closest('.set');
      const slot = slotOf(card.dataset.slot), e = getEx(slot, true), def = defFor(slot, e.v), i = +row.dataset.i;
      const kgIn = $('[data-f="kg"]', row);
      if(t.value.trim() && !kgIn.value.trim() && def.type !== 'bw' && kgIn.placeholder && kgIn.placeholder !== '–'){
        kgIn.value = kgIn.placeholder; e.sets[i].kg = kgIn.placeholder; scheduleSave();
      }
    }
  });

  view.addEventListener('click', ev => {
    const b = ev.target.closest('[data-act]'); if(!b) return;
    const act = b.dataset.act;
    const card = b.closest('.ex');
    switch(act){
      case 'today': goDate(todayStr()); break;
      case 'dprev': goDate(addDays(state.date, -1)); break;
      case 'dnext': goDate(addDays(state.date, 1)); break;
      case 'sess': state.session = b.dataset.id; renderTrain(); break;
      case 'tick': onTick(card, b.closest('.set')); break;
      case 'addset': { const e = getEx(slotOf(card.dataset.slot), true); e.sets.push({kg:'', reps:'', done:false}); scheduleSave(); rerenderCard(card); updateProgress(); break; }
      case 'rmset': {
        const e = getEx(slotOf(card.dataset.slot), true);
        if(e.sets.length > 1){ e.sets.pop(); scheduleSave(); rerenderCard(card); updateProgress(); }
        else toast('Serve almeno una serie');
        break;
      }
      case 'rir': {
        const e = getEx(slotOf(card.dataset.slot), true), n = +b.dataset.n;
        e.rir = e.rir === n ? null : n;
        $$('.rc', card).forEach(x => x.classList.toggle('on', e.rir === +x.dataset.n));
        scheduleSave(); break;
      }
      case 'var': {
        const slot = slotOf(card.dataset.slot), e = getEx(slot, true), nv = b.dataset.v;
        if(e.v !== nv){
          const empty = !e.sets.some(s => str(s.reps) || str(s.kg));
          e.v = nv;
          if(empty) e.sets = blank(plannedSets(defFor(slot, nv)));
          scheduleSave(); rerenderCard(card); updateProgress();
        }
        break;
      }
      case 'gobackup': state.tab = 'info'; render(); setTimeout(() => { const el = $('#backup'); if(el) el.scrollIntoView({block:'start'}); }, 30); break;
      case 'hmode': state.histMode = b.dataset.m; renderHistory(); break;
      case 'hexp': state.hexp = state.hexp === b.dataset.key ? null : b.dataset.key; renderHistory(); break;
      case 'hopen': { const l = data.logs[b.dataset.key]; if(l){ state.date = l.date; state.session = l.session; state.tab = 'train'; render(); window.scrollTo(0, 0); } break; }
      case 'hdel': if(confirmTap(b, 'Tocca di nuovo per eliminare')){ delete data.logs[b.dataset.key]; state.hexp = null; scheduleSave(); renderHistory(); toast('Seduta eliminata'); } break;
      case 'madd': addMeasure(); break;
      case 'mdel': if(confirmTap(b, 'Conferma')){ data.measures = data.measures.filter(m => m.id !== b.dataset.id); scheduleSave(); renderMeasures(); toast('Misura eliminata'); } break;
      case 'exp-copy': {
        const json = JSON.stringify(data), ta = $('#ioText');
        ta.value = json; ta.focus(); ta.select();
        data.lastBackup = Date.now(); scheduleSave();
        let handled = false;
        try{
          if(navigator.clipboard && navigator.clipboard.writeText){
            handled = true;
            navigator.clipboard.writeText(json).then(() => toast('Backup copiato'), () => toast('Testo selezionato: copialo a mano'));
          }
        }catch(e){ handled = false; }
        if(!handled){ try{ document.execCommand('copy'); toast('Backup copiato'); }catch(e){ toast('Testo selezionato: copialo a mano'); } }
        break;
      }
      case 'exp-dl': {
        try{
          const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
          const url = URL.createObjectURL(blob), a = document.createElement('a');
          a.href = url; a.download = 'scheda-backup-' + todayStr() + '.json';
          document.body.appendChild(a); a.click();
          data.lastBackup = Date.now(); scheduleSave();
          setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
        }catch(e){ toast('Download non disponibile qui: usa Copia backup'); }
        break;
      }
      case 'imp': {
        const txt = $('#ioText').value.trim();
        if(!txt){ toast('Incolla prima il backup nel riquadro'); break; }
        let obj; try{ obj = JSON.parse(txt); }catch(e){ toast('Il testo incollato non è un backup valido'); break; }
        if(!obj || typeof obj.logs !== 'object'){ toast('Il testo incollato non è un backup valido'); break; }
        if(!confirmTap(b, 'Sostituisce i dati attuali: tocca di nuovo')) break;
        data = obj; normalize();
        flush(); render(); toast('Backup ripristinato');
        break;
      }
      case 'reset': {
        if(!confirmTap(b, 'Tocca di nuovo per cancellare')) break;
        data = {v:1, created:Date.now(), logs:{}, measures:[]};
        flush(); render(); toast('Dati cancellati');
        break;
      }
    }
  });
}

/* ================= Avvio ================= */
async function init(){
  wireTimer(); wire();
  try{ await load(); }catch(e){ data = seed(); storeMode = 'memory'; }
  normalize();
  state.date = todayStr();
  state.session = pickSession(state.date);
  setStatus('saved');
  render();
}
init();
})();
</script>
